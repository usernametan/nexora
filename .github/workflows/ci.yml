name: CI

on:
  push:
    branches: [main, master, solar_ui]
  pull_request:
    branches: [main, master, solar_ui]

jobs:
  test-frontend:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  test-backend:
    name: Java Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run Spring Boot integration tests
        run: |
          cd server
          ./mvnw test

  e2e-suite:
    name: Playwright E2E & A11y Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build backend jar
        run: |
          cd server
          ./mvnw clean package -DskipTests

      - name: Start backend API in background
        run: |
          java -jar server/target/personal-cosmos-api-0.0.1-SNAPSHOT.jar &
          sleep 6
          curl -I http://127.0.0.1:8080/api/v1/auth/me || true

      - name: Run all Playwright tests (with backend enabled)
        env:
          E2E_BACKEND: "1"
        run: npm run test:e2e
