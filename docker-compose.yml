services:
  db:
    image: postgres:16-alpine
    container_name: cosmos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cosmos
      POSTGRES_USER: cosmos
      POSTGRES_PASSWORD: cosmo-secret-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmos -d cosmos"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cosmos-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/cosmos
      DB_USER: cosmos
      DB_PASSWORD: cosmo-secret-password
      APP_JWT_SECRET: production-grade-secret-key-at-least-32-chars-long
      APP_CORS_ORIGINS: http://localhost,http://localhost:5173,http://localhost:80
      APP_FILE_STORAGE_DIR: /app/data/uploads
    volumes:
      - api-uploads:/app/data/uploads
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cosmos-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  postgres-data:
  api-uploads:
